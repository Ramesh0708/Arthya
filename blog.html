<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthya Blog — Finance Insights</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="Finance insights from Arthya on credit cards, cashback, and value.">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="assets/arthya_logo_transparent.png" alt="Arthya logo">
      Arthya
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="blog.html" class="is-active">Blog</a>
    </nav>
  </header>

  <div class="blog-wrap">
    <h1 class="page-title">Finance Insights</h1>
    <p class="section-text" style="text-align:center; margin: 0 auto 40px;">
      Notes on value, credit cards, and making every rupee work harder.
    </p>
    <div id="posts" class="loading">Loading finance articles...</div>
  </div>

  <footer class="site-footer">
    © 2026 Arthya — Where Value Finds Purpose
  </footer>

  <script>
    const glow = document.querySelector(".glow");
    document.addEventListener("mousemove", (e) => {
      glow.style.left = e.clientX + "px";
      glow.style.top = e.clientY + "px";
    });

    const rssUrl = "https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@rameshchoudhary8675";

    fetch(rssUrl)
      .then((res) => res.json())
      .then((data) => {
        const container = document.getElementById("posts");
        container.innerHTML = "";

        const financePosts = (data.items || [])
          .filter((post) =>
            (post.categories || []).some((c) =>
              ["finance", "credit-card", "cashback", "Arthya"].includes(c)
            )
          )
          .slice(0, 6);

        if (financePosts.length === 0) {
          container.innerHTML = '<p class="loading">No finance articles found yet. Meanwhile, read the origin story below.</p>';
          const fallback = document.createElement("div");
          fallback.className = "blog-card";
          fallback.innerHTML = `
            <div class="tag-badge">Origin</div>
            <h3>How I Saved ₹1,500 at Hush Puppies</h3>
            <p>The moment that sparked Arthya.</p>
            <a href="blog/hush-puppies.html">Read story →</a>
          `;
          container.appendChild(fallback);
          return;
        }

        financePosts.forEach((post) => {
          const div = document.createElement("div");
          div.className = "blog-card";
          const plain = (post.description || "").replace(/<[^>]+>/g, "").substring(0, 160);
          div.innerHTML = `
            <div class="tag-badge">Finance</div>
            <h3>${post.title}</h3>
            <p>${(post.pubDate || "").split(" ")[0]}</p>
            <p>${plain}...</p>
            <a href="${post.link}" target="_blank" rel="noopener">Read on Medium →</a>
          `;
          container.appendChild(div);
        });
      })
      .catch(() => {
        document.getElementById("posts").innerHTML = "Unable to load Medium posts.";
      });
  </script>
</body>
</html>
